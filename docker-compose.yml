version: "3.9"

services:
  pcb-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    image: pcb-defect-yolo26:latest
    container_name: pcb-inspector
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount trained model weights so the container can find them
      - ./runs:/app/runs:ro
      # Persist batch results and logs
      - ./runs:/app/runs
      # Optional: demo images
      - ./data/samples:/app/data/samples:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
